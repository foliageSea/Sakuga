name: Release

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:
    inputs:
      tag:
        description: Existing release tag (e.g. v0.1.1)
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: release-${{ inputs.tag || github.ref_name }}

env:
  RELEASE_TAG: ${{ inputs.tag || github.ref_name }}

jobs:
  version:
    runs-on: ubuntu-24.04
    outputs:
      name: ${{ steps.version.outputs.name }}
      number: ${{ steps.version.outputs.number }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ inputs.tag && format('refs/tags/{0}', inputs.tag) || github.sha }}
          persist-credentials: false
      - name: Validate release tag
        id: version
        shell: bash
        run: |
          version=$(tool/release.sh --version)
          name=${version%+*}
          number=${version##*+}
          if [[ "$RELEASE_TAG" != "v$name" ]]; then
            printf 'Expected tag v%s for pubspec version %s, got %s\n' "$name" "$version" "$RELEASE_TAG" >&2
            exit 1
          fi
          printf 'name=%s\nnumber=%s\n' "$name" "$number" >> "$GITHUB_OUTPUT"

  android:
    needs: version
    runs-on: ubuntu-24.04
    environment: android-release
    env:
      BUILD_NAME: ${{ needs.version.outputs.name }}
      BUILD_NUMBER: ${{ needs.version.outputs.number }}
      # Match flutter.ndkVersion in the SDK pinned by .fvmrc.
      NDK_VERSION: '28.2.13676358'
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ inputs.tag && format('refs/tags/{0}', inputs.tag) || github.sha }}
          persist-credentials: false
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          flutter-version-file: .fvmrc
      - name: Install Android NDK
        run: |
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --install "ndk;$NDK_VERSION"
          printf 'ANDROID_NDK_HOME=%s/ndk/%s\n' "$ANDROID_HOME" "$NDK_VERSION" >> "$GITHUB_ENV"
      - name: Build Android arm64 release APK
        shell: bash
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          # Do not rebuild historical tags that still use the retired credentials.
          if [[ -n "$(git ls-files -- android/key.properties android/sakuga-release.jks)" ]]; then
            echo 'The selected tag still tracks legacy Android signing files. Use a tag with the signing migration.' >&2
            exit 1
          fi
          : "${ANDROID_KEYSTORE_BASE64:?Missing ANDROID_KEYSTORE_BASE64 secret}"
          : "${ANDROID_KEYSTORE_PASSWORD:?Missing ANDROID_KEYSTORE_PASSWORD secret}"
          : "${ANDROID_KEY_ALIAS:?Missing ANDROID_KEY_ALIAS secret}"
          : "${ANDROID_KEY_PASSWORD:?Missing ANDROID_KEY_PASSWORD secret}"
          umask 077
          ANDROID_KEYSTORE_PATH=$(mktemp "$RUNNER_TEMP/sakuga-signing.XXXXXX")
          export ANDROID_KEYSTORE_PATH
          trap 'rm -f -- "$ANDROID_KEYSTORE_PATH"' EXIT
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$ANDROID_KEYSTORE_PATH"
          unset ANDROID_KEYSTORE_BASE64
          # Exclude other ABIs without letting Flutter offset Android's versionCode.
          flutter build apk --release --target-platform android-arm64 --split-per-abi \
            --android-project-arg=force-version-code-ignoring-abi=true \
            --build-name="$BUILD_NAME" --build-number="$BUILD_NUMBER"
          mkdir -p dist
          cp build/app/outputs/flutter-apk/app-arm64-v8a-release.apk \
            "dist/Sakuga-${BUILD_NAME}-${BUILD_NUMBER}-android-arm64-v8a.apk"
      - uses: actions/upload-artifact@v6
        with:
          name: android-release
          path: dist/*.apk
          if-no-files-found: error
          overwrite: true

  macos:
    needs: version
    runs-on: macos-15
    env:
      BUILD_NAME: ${{ needs.version.outputs.name }}
      BUILD_NUMBER: ${{ needs.version.outputs.number }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ inputs.tag && format('refs/tags/{0}', inputs.tag) || github.sha }}
          persist-credentials: false
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          flutter-version-file: .fvmrc
      - name: Build macOS arm64 release DMG
        shell: bash
        run: |
          flutter config --enable-macos-arm64-only
          tool/build_dmg.sh --build-name="$BUILD_NAME" --build-number="$BUILD_NUMBER"
          mkdir -p dist
          cp "build/macos/dmg/Sakuga-${BUILD_NAME}+${BUILD_NUMBER}-macos-arm64.dmg" \
            "dist/Sakuga-${BUILD_NAME}-${BUILD_NUMBER}-macos-arm64.dmg"
      - uses: actions/upload-artifact@v6
        with:
          name: macos-release
          path: dist/*.dmg
          if-no-files-found: error
          overwrite: true

  publish:
    needs: [android, macos]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v7
        with:
          name: android-release
          path: dist
      - uses: actions/download-artifact@v7
        with:
          name: macos-release
          path: dist
      - name: Publish GitHub Release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          gh release create "$RELEASE_TAG" --verify-tag --generate-notes \
            dist/*.apk dist/*.dmg
