name: Windows Build

on:
  workflow_dispatch:
  workflow_call:
    inputs:
      ref:
        type: string
        required: true
      build-name:
        type: string
        required: true
      build-number:
        type: string
        required: true

permissions:
  contents: read

jobs:
  windows:
    runs-on: windows-2025
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ inputs.ref || github.sha }}
          persist-credentials: false
      - name: Resolve Windows build version
        id: version
        shell: bash
        env:
          EXPECTED_NAME: ${{ inputs.build-name }}
          EXPECTED_NUMBER: ${{ inputs.build-number }}
        run: |
          if [[ ! -f windows/CMakeLists.txt ]]; then
            echo 'The selected ref does not contain the Windows runner. Use a ref that includes Windows support.' >&2
            exit 1
          fi
          if [[ ! -f tool/build_windows_installer.ps1 ]]; then
            echo 'The selected ref predates Windows installer support. Use a ref that includes the installer.' >&2
            exit 1
          fi
          version=$(bash tool/release.sh --version)
          name=${version%+*}
          number=${version##*+}
          if [[ -n "$EXPECTED_NAME$EXPECTED_NUMBER" && "$version" != "$EXPECTED_NAME+$EXPECTED_NUMBER" ]]; then
            echo 'The checked-out pubspec version differs from the validated release version.' >&2
            exit 1
          fi
          printf 'name=%s\nnumber=%s\n' "$name" "$number" >> "$GITHUB_OUTPUT"
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          flutter-version-file: .fvmrc
      - name: Build Windows x64 release
        shell: pwsh
        env:
          BUILD_NAME: ${{ steps.version.outputs.name }}
          BUILD_NUMBER: ${{ steps.version.outputs.number }}
        run: |
          flutter build windows --release --build-name="$env:BUILD_NAME" --build-number="$env:BUILD_NUMBER"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Build Windows installer
        shell: pwsh
        env:
          BUILD_NAME: ${{ steps.version.outputs.name }}
          BUILD_NUMBER: ${{ steps.version.outputs.number }}
        run: |
          ./tool/build_windows_installer.ps1 -BuildName $env:BUILD_NAME -BuildNumber $env:BUILD_NUMBER
      - name: Test Windows installer and uninstaller
        timeout-minutes: 5
        shell: pwsh
        env:
          BUILD_NAME: ${{ steps.version.outputs.name }}
          BUILD_NUMBER: ${{ steps.version.outputs.number }}
        run: |
          $setup = (Resolve-Path "dist/Sakuga-$env:BUILD_NAME-$env:BUILD_NUMBER-windows-x64-setup.exe").Path
          $installDir = Join-Path $env:RUNNER_TEMP 'Sakuga installer smoke test'
          $installLog = Join-Path $env:RUNNER_TEMP 'sakuga-install.log'
          $uninstallLog = Join-Path $env:RUNNER_TEMP 'sakuga-uninstall.log'
          function Invoke-Setup([string]$Exe, [string[]]$Options, [string]$Log) {
            $result = Start-Process -FilePath $Exe -ArgumentList ($Options + @('/VERYSILENT', '/SUPPRESSMSGBOXES', '/NORESTART', ('/LOG="{0}"' -f $Log))) -PassThru -Wait
            if ($result.ExitCode -ne 0) {
              if (Test-Path -LiteralPath $Log) { Get-Content -LiteralPath $Log }
              throw "Installer process exited with code $($result.ExitCode): $Exe"
            }
          }
          Invoke-Setup $setup @('/SP-', ('/DIR="{0}"' -f $installDir)) $installLog
          try {
            $bundle = (Resolve-Path 'build/windows/x64/runner/Release').Path
            $files = Get-ChildItem -LiteralPath $bundle -File -Recurse -Force | ForEach-Object {
              [IO.Path]::GetRelativePath($bundle, $_.FullName)
            }
            foreach ($file in ($files + @('LICENSE', 'THIRD_PARTY_NOTICES.md'))) {
              if (!(Test-Path -LiteralPath (Join-Path $installDir $file) -PathType Leaf)) {
                throw "Missing installed file: $file"
              }
            }
          } finally {
            Invoke-Setup (Join-Path $installDir 'unins000.exe') @() $uninstallLog
          }
          if (Test-Path -LiteralPath (Join-Path $installDir 'Sakuga.exe')) {
            throw 'Sakuga.exe remains after uninstall.'
          }
      - name: Package and verify Windows ZIP
        shell: pwsh
        env:
          BUILD_NAME: ${{ steps.version.outputs.name }}
          BUILD_NUMBER: ${{ steps.version.outputs.number }}
        run: |
          $bundle = (Resolve-Path 'build/windows/x64/runner/Release').Path
          $requiredFiles = @(
            'Sakuga.exe'
            'flutter_windows.dll'
            'libmpv-2.dll'
            'media_kit_event_loop.dll'
            'media_kit_video_plugin.dll'
            'data/icudtl.dat'
            'data/app.so'
            'data/flutter_assets/AssetManifest.bin'
          )
          foreach ($file in $requiredFiles) {
            if (!(Test-Path -LiteralPath (Join-Path $bundle $file) -PathType Leaf)) {
              throw "Missing Windows build output: $file"
            }
          }
          $version = (Get-Item -LiteralPath (Join-Path $bundle 'Sakuga.exe')).VersionInfo
          $expectedVersion = "$env:BUILD_NAME.$env:BUILD_NUMBER"
          $fileVersion = "$($version.FileMajorPart).$($version.FileMinorPart).$($version.FileBuildPart).$($version.FilePrivatePart)"
          if ($fileVersion -ne $expectedVersion) {
            throw "Expected executable version $expectedVersion, got $fileVersion"
          }
          $notices = @('LICENSE', 'THIRD_PARTY_NOTICES.md')
          Copy-Item -LiteralPath $notices -Destination $bundle
          $dist = (New-Item -ItemType Directory -Path dist -Force).FullName
          $zip = Join-Path $dist "Sakuga-$env:BUILD_NAME-$env:BUILD_NUMBER-windows-x64.zip"
          [System.IO.Compression.ZipFile]::CreateFromDirectory($bundle, $zip, 'Optimal', $false)
          $archive = [System.IO.Compression.ZipFile]::OpenRead($zip)
          try {
            foreach ($file in ($requiredFiles + $notices)) {
              if ($null -eq $archive.GetEntry($file)) { throw "Missing Windows ZIP entry: $file" }
            }
          } finally {
            $archive.Dispose()
          }
      - uses: actions/upload-artifact@v6
        with:
          name: windows-release
          path: |
            dist/*-windows-x64.zip
            dist/*-windows-x64-setup.exe
          if-no-files-found: error
          overwrite: true
